// ═══════════════════════════════════════════════════════════════════════
// MATCH PLAY BRACKET — mirrors the main app's slot resolution
// ═══════════════════════════════════════════════════════════════════════
function seResolveSlot(slot, bracket, matches) {
    if (!slot) return null;
    if (slot.source === 'seed') {
        const pid = (bracket.playerIds || [])[slot.seedIndex];
        return { playerId: pid, isBye: pid == null };
    }
    if (slot.source === 'match') {
        const src = matches[slot.matchId];
        if (!src || src.status !== 'decided') return null;
        const key = slot.takeWinner ? src.winner : src.loser;
        if (key === 'bye-advance') return { playerId: null, isBye: true };
        return seResolveSlot(key === 'slot1' ? src.slot1 : src.slot2, bracket, matches);
    }
    return null;
}

// Which event round number is the round being scored? (1-indexed, chronological)
function seRoundNumberFor(round) {
    if (!round) return null;
    const evId = round.eventId;
    const siblings = (state.allRounds || [])
        .filter(r => r.eventId === evId && r.active === true && (r.timestamp || r.id))
        .sort((a, b) => (a.timestamp || a.id) - (b.timestamp || b.id));
    const i = siblings.findIndex(r => idsEqual(r.id, round.id));
    return i >= 0 ? i + 1 : null;
}

// Every bracket match scheduled for THIS round, with both players resolved.
function seLiveMatches(round) {
    const ev = (state.events || []).find(e => String(e.id) === String(round && round.eventId))
        || (state.events || []).find(e => String(e.id) === String(state.currentEventId));
    if (!ev || !ev.bracket || !ev.bracket.matches) return { matches: [], reason: 'no-bracket' };
    const rn = seRoundNumberFor(round);
    if (!rn) return { matches: [], reason: 'round-not-in-event' };
    const bracket = ev.bracket;
    const all = bracket.matches;
    const out = [];
    Object.keys(all).forEach(mid => {
        const m = all[mid];
        if (m.roundNumber !== rn) return;
        const a = seResolveSlot(m.slot1, bracket, all);
        const b = seResolveSlot(m.slot2, bracket, all);
        if (!a || !b || a.isBye || b.isBye) return;   // byes aren't playable matches
        out.push({ id: mid, match: m, p1Id: a.playerId, p2Id: b.playerId,
                   segment: m.holeSegment || 'full' });
    });
    return { matches: out, reason: out.length ? 'ok' : 'none-this-round' };
}

// Hole range for a match segment
function seSegmentHoles(segment) {
    if (segment === 'front9') return [0, 9];
    if (segment === 'back9') return [9, 18];
    return [0, 18];
}

// Net match status computed ONLY on holes where BOTH players have a score.
function seMatchStatus(round, p1, p2, segment) {
    const [lo, hi] = seSegmentHoles(segment);
    const h1 = seHandicapForRound(round, p1);
    const h2 = seHandicapForRound(round, p2);
    let up = 0, played = 0;
    const holes = [];
    for (let h = lo; h < hi; h++) {
        const a = p1 ? effectiveScore(round, p1.id, h) : '';
        const b = p2 ? effectiveScore(round, p2.id, h) : '';
        if (a === '' || a == null || b === '' || b == null) {
            holes.push({ h, state: 'pending' });
            continue;
        }
        const idx = (round.handicaps || [])[h];
        const an = parseInt(a, 10) - strokesOnHole(h1, idx);
        const bn = parseInt(b, 10) - strokesOnHole(h2, idx);
        played++;
        let st = 'halved';
        if (an < bn) { up++; st = 'p1'; }
        else if (bn < an) { up--; st = 'p2'; }
        holes.push({ h, state: st, gross1: parseInt(a, 10), gross2: parseInt(b, 10), net1: an, net2: bn });
    }
    const remaining = (hi - lo) - played;
    let label, leader = null;
    if (played === 0) label = 'NOT STARTED';
    else if (up === 0) label = 'ALL SQUARE';
    else if (Math.abs(up) > remaining) {
        label = `${Math.abs(up)}&${remaining}`;   // mathematically closed out
        leader = up > 0 ? 'p1' : 'p2';
    } else {
        label = `${Math.abs(up)} UP`;
        leader = up > 0 ? 'p1' : 'p2';
    }
    return { up, played, remaining, label, leader, holes, closed: played > 0 && Math.abs(up) > remaining };
}

// ═══════════════════════════════════════════════════════════════════════
// LIVE LEADERBOARD — everyone's round as it stands right now
// Reads the same live-synced rounds data, so it updates as other groups score.
// ═══════════════════════════════════════════════════════════════════════
function renderLeaderboard() {
    const round = getRoundById(state.selectedRoundId);
    if (!round) { state.board = null; renderScoreEntry(); return; }
    const tab = state.board || 'teams';

    setHeader(round.courseName || 'Round', 'Live leaderboard');
    const appEl = $('#app');
    appEl.innerHTML = '';

    // Audit view for a single player
    if (state.auditPlayerId != null) {
        const ap = getAllRoundPlayers(round).find(x => idsEqual(x.id, state.auditPlayerId));
        if (ap) { appEl.appendChild(renderPlayerAudit(round, ap)); return; }
        state.auditPlayerId = null;
    }

    // Tabs
    const tabs = el('div', { class: 'lb-tabs' });
    [['teams', '🏆 Teams'], ['players', '🎯 Players'], ['match', '⚔️ Matches']].forEach(([k, label]) => {
        tabs.appendChild(el('button', {
            class: 'lb-tab' + (tab === k ? ' on' : ''), type: 'button',
            onclick: () => { state.board = k; renderLeaderboard(); }
        }, label));
    });
    appEl.appendChild(tabs);
    if (tab === 'players') {
        appEl.appendChild(el('div', { class: 'lb-sub', style: 'text-align:center;margin-bottom:8px;' },
            'Tap a player to see how their total was calculated'));
    }

    const players = getAllRoundPlayers(round).map(p => {
        const t = computePlayerTotals(round, p);
        return { ...p, gross: t.gross, points: t.points, thru: t.thru };
    });

    if (tab === 'players') {
        const ranked = players.slice().sort((a, b) => b.points - a.points || b.thru - a.thru);
        if (ranked.every(p => p.thru === 0)) {
            appEl.appendChild(el('div', { class: 'lb-empty' }, 'No scores in yet — come back after a hole or two.'));
        }
        ranked.forEach((p, i) => {
            const isMe = idsEqual(p.id, state.currentPlayerId);
            appEl.appendChild(el('div', {
                class: 'lb-row' + (isMe ? ' me' : ''),
                style: 'cursor:pointer;',
                onclick: () => { state.auditPlayerId = idStr(p.id); renderLeaderboard(); }
            },
                el('div', { class: 'lb-pos' }, i === 0 && p.thru > 0 ? '\u{1F451}' : '#' + (i + 1)),
                el('div', { class: 'lb-name' },
                    document.createTextNode(p.name || '?'),
                    el('div', { class: 'lb-sub' }, `${p.teamName || ''}${p.gross ? ' \u00b7 ' + p.gross + ' gross' : ''}`)),
                el('div', { class: 'lb-thru' }, p.thru ? 'thru ' + p.thru : '\u2014'),
                el('div', { class: 'lb-pts' }, String(p.points))
            ));
        });
    } else if (tab === 'teams') {
        const byTeam = {};
        (round.teams || []).forEach(team => {
            const rows = (team.players || []).map(p => players.find(x => idsEqual(x.id, p.id))).filter(Boolean);
            byTeam[team.teamName || 'Team'] = {
                name: team.teamName || 'Team',
                points: rows.reduce((s, r) => s + r.points, 0),
                thru: rows.length ? Math.max(...rows.map(r => r.thru)) : 0,
                members: rows
            };
        });
        const ranked = Object.values(byTeam).sort((a, b) => b.points - a.points);
        if (ranked.every(t => t.thru === 0)) {
            appEl.appendChild(el('div', { class: 'lb-empty' }, 'No scores in yet — come back after a hole or two.'));
        }
        ranked.forEach((t, i) => {
            const mine = t.members.some(m => idsEqual(m.id, state.currentPlayerId));
            appEl.appendChild(el('div', { class: 'lb-row' + (mine ? ' me' : '') },
                el('div', { class: 'lb-pos' }, i === 0 && t.thru > 0 ? '\u{1F451}' : '#' + (i + 1)),
                el('div', { class: 'lb-name' },
                    document.createTextNode(t.name),
                    el('div', { class: 'lb-sub' }, t.members.map(m => `${m.name}: ${m.points}`).join(' \u00b7 '))),
                el('div', { class: 'lb-thru' }, t.thru ? 'thru ' + t.thru : '\u2014'),
                el('div', { class: 'lb-pts' }, String(t.points))
            ));
        });
    } else {
        // ── MATCHES: the event's match-play bracket for this round ──
        // Pairings come from the bracket (players may be in different groups); status is
        // computed only on holes where BOTH players have a score in.
        const { matches, reason } = seLiveMatches(round);
        const allPlayers = getAllRoundPlayers(round);
        const findP = (id) => allPlayers.find(p => idsEqual(p.id, id));

        if (matches.length === 0) {
            const msg = reason === 'no-bracket'
                ? 'No match-play bracket is set up for this event yet.'
                : reason === 'round-not-in-event'
                    ? 'This round isn\'t part of the event\'s match schedule.'
                    : 'No bracket matches are scheduled for this round.';
            appEl.appendChild(el('div', { class: 'lb-empty' }, msg));
        } else {
            // Your own match first
            const mine = matches.filter(m => idsEqual(m.p1Id, state.currentPlayerId) || idsEqual(m.p2Id, state.currentPlayerId));
            const others = matches.filter(m => !mine.includes(m));
            [...mine, ...others].forEach(entry => {
                const p1 = findP(entry.p1Id), p2 = findP(entry.p2Id);
                const st = seMatchStatus(round, p1, p2, entry.segment);
                const isMine = mine.includes(entry);
                const decided = entry.match.status === 'decided';
                const segLabel = entry.segment === 'front9' ? 'Front 9'
                    : (entry.segment === 'back9' ? 'Back 9' : '18 holes');

                // Leader name + status colour
                const leadName = st.leader === 'p1' ? (p1 && p1.name) : (st.leader === 'p2' ? (p2 && p2.name) : null);
                const statusColor = st.played === 0 ? 'var(--ink-soft)'
                    : (st.leader ? (st.closed ? '#2E7D32' : '#1F5C39') : 'var(--ink-soft)');

                const card = el('div', { class: 'card', style: `padding:14px;${isMine ? 'border-left:5px solid var(--fairway);' : ''}` });
                card.appendChild(el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;gap:10px;' },
                    el('div', { style: 'font-weight:900;font-size:16px;' },
                        `${(p1 && p1.name) || '?'} vs ${(p2 && p2.name) || '?'}`),
                    el('div', { style: `font-weight:900;font-size:17px;color:${statusColor};white-space:nowrap;` },
                        st.played === 0 ? 'NOT STARTED' : (leadName ? `${leadName.split(' ')[0]} ${st.label}` : st.label))
                ));
                card.appendChild(el('div', { class: 'lb-sub', style: 'margin-top:2px;' },
                    `${segLabel} \u00b7 thru ${st.played}${st.remaining > 0 ? ' \u00b7 ' + st.remaining + ' to play' : ''}` +
                    (decided ? ' \u00b7 \u2713 decided' : '') + (isMine ? ' \u00b7 YOUR MATCH' : '')));

                // Hole strip, coloured from the leader's perspective
                const strip = el('div', { style: 'display:flex;gap:3px;flex-wrap:wrap;margin-top:10px;' });
                st.holes.forEach(h => {
                    const col = h.state === 'pending' ? '#E8E4D9'
                        : h.state === 'halved' ? '#9CA3AF'
                        : h.state === 'p1' ? '#2E7D32' : '#C62828';
                    strip.appendChild(el('div', {
                        title: h.state === 'pending' ? `Hole ${h.h + 1}: waiting`
                            : `Hole ${h.h + 1}: ${h.gross1}(${h.net1}) v ${h.gross2}(${h.net2})`,
                        style: `width:15px;height:15px;border-radius:4px;background:${col};`
                    }));
                });
                card.appendChild(strip);

                // Hole-by-hole detail for your own match
                if (isMine && st.played > 0) {
                    const tbl = el('div', { style: 'margin-top:10px;border-top:1px solid var(--sand);padding-top:8px;' });
                    tbl.appendChild(el('div', { style: 'display:flex;font-size:11px;font-weight:800;color:var(--ink-soft);padding:0 2px 4px;' },
                        el('div', { style: 'width:34px;' }, 'HOLE'),
                        el('div', { style: 'flex:1;' }, (p1 && p1.name || '').split(' ')[0]),
                        el('div', { style: 'flex:1;' }, (p2 && p2.name || '').split(' ')[0]),
                        el('div', { style: 'width:56px;text-align:right;' }, 'MATCH')));
                    let run = 0;
                    st.holes.filter(h => h.state !== 'pending').forEach(h => {
                        if (h.state === 'p1') run++; else if (h.state === 'p2') run--;
                        const rowCol = h.state === 'p1' ? '#2E7D32' : (h.state === 'p2' ? '#C62828' : 'var(--ink-soft)');
                        tbl.appendChild(el('div', { style: 'display:flex;align-items:center;font-size:13px;padding:3px 2px;border-bottom:1px solid #F3F1EA;' },
                            el('div', { style: 'width:34px;font-weight:700;' }, String(h.h + 1)),
                            el('div', { style: `flex:1;font-weight:${h.state === 'p1' ? '900' : '600'};color:${h.state === 'p1' ? '#2E7D32' : 'inherit'};` },
                                `${h.gross1} (${h.net1})`),
                            el('div', { style: `flex:1;font-weight:${h.state === 'p2' ? '900' : '600'};color:${h.state === 'p2' ? '#C62828' : 'inherit'};` },
                                `${h.gross2} (${h.net2})`),
                            el('div', { style: `width:56px;text-align:right;font-weight:800;color:${rowCol};` },
                                run === 0 ? 'AS' : (run > 0 ? `${run} UP` : `${-run} DN`))));
                    });
                    tbl.appendChild(el('div', { class: 'lb-sub', style: 'margin-top:6px;' }, 'Gross (net) \u00b7 match position after each hole'));
                    card.appendChild(tbl);
                }
                appEl.appendChild(card);
            });
        }
    }

    appEl.appendChild(el('button', {
        class: 'foot-btn prev', type: 'button', style: 'width:100%;margin-top:10px;',
        onclick: () => { state.board = null; renderScoreEntry(); }
    }, '\u2190 Back to scoring'));
}

function buildFooterNav() {
    const wrap = el('div', { class: 'foot-nav' });
    // Pulse the Next button once every score on this hole is in — the obvious next step.
    const round = getRoundById(state.selectedRoundId);
    const gp = getGroupPlayers(round, state.groupNumber);
    const holeDone = holeStatus(round, gp, state.currentHole) === 'complete';
    wrap.appendChild(el('button', {
        class: 'foot-btn prev',
        onclick: () => goToHole(state.currentHole - 1),
        disabled: state.currentHole === 0 ? '' : null
    }, el('span', null, '←'), el('span', null, 'Prev hole')));
    if (state.currentHole === 17) {
        // Hole 18: the round ends HERE — a distinct Finish button (also the save moment,
        // since there is no next hole to trigger the usual save-on-hole-change).
        wrap.appendChild(el('button', {
            class: 'foot-btn finish' + (holeDone ? ' pulse' : ''),
            onclick: () => finishRound()
        }, el('span', null, '🏁'), el('span', null, 'Finish round')));
    } else {
        wrap.appendChild(el('button', {
            class: 'foot-btn next' + (holeDone ? ' pulse' : ''),
            onclick: () => goToHole(state.currentHole + 1)
        }, el('span', null, holeDone ? 'Hole done — next' : 'Next hole'), el('span', null, '→')));
    }
    return wrap;
}

// ─── Finish round: save everything, then show the wrap-up screen ───
function finishRound() {
    if (hasPendingEdits()) { setStatus('Saving…', 'saving'); flushPendingEdits(); }
    state.finished = true;
    state.sheetPlayerId = null;
    renderRoundFinished();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderRoundFinished() {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const groupPlayers = getGroupPlayers(round, state.groupNumber);

    setHeader(round.courseName || 'Round', `Group ${state.groupNumber} · Finished`);
    $('#switch-btn').style.display = 'inline-block';

    // Any holes still incomplete? (missing scores or missing BBB points)
    const incomplete = [];
    for (let h = 0; h < 18; h++) {
        if (holeStatus(round, groupPlayers, h) !== 'complete') incomplete.push(h);
    }

    const appEl = $('#app');
    appEl.innerHTML = '';

    const card = el('div', { class: 'card', style: 'text-align:center;' });
    card.appendChild(el('div', { style: 'font-size:56px;line-height:1;margin:6px 0 10px;' }, incomplete.length === 0 ? '🏆' : '🏁'));
    card.appendChild(el('h2', null, incomplete.length === 0 ? 'Round complete!' : 'Round finished'));
    card.appendChild(el('p', { class: 'muted' }, 'All scores are saved. Final results and awards come together in the main app.'));
    appEl.appendChild(card);

    // Incomplete-hole nudge: tap a hole to jump back and fix it
    if (incomplete.length > 0) {
        const warn = el('div', { class: 'card' });
        warn.appendChild(el('h2', { style: 'font-size:16px;' }, '⚠️ Still missing something on:'));
        const row = el('div', { class: 'pick-row', style: 'margin-top:8px;' });
        incomplete.forEach(h => {
            row.appendChild(el('button', {
                class: 'pick-chip', type: 'button',
                onclick: () => { state.finished = false; goToHole(h); }
            }, `Hole ${h + 1}`));
        });
        warn.appendChild(row);
        warn.appendChild(el('p', { class: 'muted', style: 'margin-top:8px;' }, 'Scores or BBB points are incomplete on these holes. Tap one to jump back.'));
        appEl.appendChild(warn);
    }

    // Group scorecard summary
    const sum = el('div', { class: 'card' });
    sum.appendChild(el('h2', { style: 'font-size:16px;' }, "Your group's day"));
    groupPlayers.forEach(p => {
        const t = computePlayerTotals(round, p);
        const r = el('div', { class: 'balls-row' });
        r.appendChild(el('div', { class: 'balls-name' }, p.name || '?'));
        r.appendChild(el('div', { style: 'font-weight:900;font-size:17px;font-variant-numeric:tabular-nums;' },
            `${t.gross || '—'} gross · ${t.points} pts`));
        sum.appendChild(r);
    });
    appEl.appendChild(sum);

    const back = el('button', {
        class: 'foot-btn prev', type: 'button',
        style: 'width:100%;margin-top:4px;',
        onclick: () => { state.finished = false; renderScoreEntry(); }
    }, '← Back to scoring');
    appEl.appendChild(back);
}

function goToHole(holeIdx) {
    if (holeIdx < 0 || holeIdx > 17) return;
    if (state.autoAdvanceTimer) { clearTimeout(state.autoAdvanceTimer); state.autoAdvanceTimer = null; }
    if (hasPendingEdits()) {
        if (state.pendingTimer) clearTimeout(state.pendingTimer);
        flushPendingEdits();
    }
    state.currentHole = holeIdx;
    state.finished = false;
    state.sheetPlayerId = null;       // close any open score sheet on hole change
    state.padExpanded = false;
    // This is THE save moment: edits collected on the hole flush now.
    if (hasPendingEdits()) { setStatus('Saving…', 'saving'); flushPendingEdits(); }
    renderScoreEntry();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── SKINS GAME ── always net. pointsPerSkin: round override → league setting → 0.5.
// Skins points are event points, added to the player's total. Uses effectiveScore
// so pending (unsaved) edits are reflected live.
// Returns { points: {id: pts}, counts: {id: skins}, pointsPerSkin }.
// King of Ties: distribute an unresolved skins pot (P skins) among the players
// who tied skins during the round. tieInfo: { playerId: { ties, best } }.
// The leader(s) — most ties, lowest tied score breaking ties — take ceil(P/2),
// split equally; the other tied players split the remainder. If everyone
// involved is tied for first, the pot is split evenly. Mirrors the admin app.
function kingOfTiesShares(tieInfo, pot) {
    const shares = {}, leaders = [];
    const eligible = Object.keys(tieInfo).filter(id => tieInfo[id].ties > 0);
    if (!eligible.length || !(pot > 0)) return { shares, leaders };
    eligible.sort((a, b) => (tieInfo[b].ties - tieInfo[a].ties) ||
                           (tieInfo[a].best - tieInfo[b].best));
    const top = tieInfo[eligible[0]];
    const first = eligible.filter(id => tieInfo[id].ties === top.ties &&
                                        tieInfo[id].best === top.best);
    first.forEach(id => leaders.push(id));
    if (first.length === eligible.length) {
        first.forEach(id => { shares[id] = pot / first.length; });
        return { shares, leaders };
    }
    const leaderShare = Math.ceil(pot / 2);
    const rest = pot - leaderShare;
    const others = eligible.filter(id => first.indexOf(id) < 0);
    first.forEach(id => { shares[id] = leaderShare / first.length; });
    if (others.length > 0) {
        others.forEach(id => { shares[id] = rest / others.length; });
    } else {
        first.forEach(id => { shares[id] = pot / first.length; });
    }
    return { shares, leaders };
}

function computeSkinsMaps(round) {
    const out = { points: {}, counts: {}, pointsPerSkin: 0.5 };
    if (!round) return out;
    const sk = (round && round.skins) || {};
    if (sk.enabled === false || !Array.isArray(round.teams)) return out;
    const ppsRaw = (sk.pointsPerSkin != null) ? sk.pointsPerSkin
        : ((typeof BONUS !== 'undefined' && BONUS.skins != null) ? BONUS.skins : 0.5);
    const pointsPerSkin = Math.max(0, parseFloat(ppsRaw) || 0);
    out.pointsPerSkin = pointsPerSkin;
    const players = [];
    (round.teams || []).forEach(team => (team.players || []).forEach(p => {
        players.push({ id: p.id, hc: seHandicapForRound(round, p) || 0 });
        out.points[String(p.id)] = 0;
        out.counts[String(p.id)] = 0;
    }));
    const hcaps = round.handicaps || [];
    const strokesOn = (hc, i) => {
        const holeHcap = parseInt(hcaps[i]) || (i + 1);
        let s = 0;
        if (hc >= holeHcap) s = 1;
        if (hc >= holeHcap + 18) s = 2;
        return s;
    };
    const k = (id) => String(id);
    let carry = 0;
    const tieInfo = {}; // k(playerId) -> { ties, best } for the King of Ties rule
    for (let i = 0; i < 18; i++) {
        const contenders = [];
        players.forEach(pl => {
            const s = effectiveScore(round, pl.id, i);
            if (s === '' || s == null) return;
            const n = parseInt(s, 10);
            if (isNaN(n) || n <= 0) return;
            contenders.push({ id: pl.id, score: n - strokesOn(pl.hc, i) }); // always net
        });
        if (!contenders.length) continue;
        const best = Math.min.apply(null, contenders.map(c => c.score));
        const leaders = contenders.filter(c => c.score === best);
        if (leaders.length === 1) {
            out.counts[k(leaders[0].id)] += 1 + carry;
            carry = 0;
        } else if (sk.carryover !== false) {
            leaders.forEach(l => {
                const ti = tieInfo[k(l.id)] || (tieInfo[k(l.id)] = { ties: 0, best: Infinity });
                ti.ties += 1;
                if (best < ti.best) ti.best = best;
            });
            if (i === 17) {
                // King of Ties: unresolved pot goes by tie involvement, not an
                // even split among the 18th-hole tiers — mirrors the admin app.
                const pot = carry + 1; // hole 18's own skin joins the pot
                const kot = kingOfTiesShares(tieInfo, pot);
                Object.keys(kot.shares).forEach(id => {
                    out.counts[id] = (out.counts[id] || 0) + kot.shares[id];
                });
                carry = 0;
            } else {
                carry += 1;
            }
        }
    }
    players.forEach(pl => {
        out.points[k(pl.id)] = Math.round((out.counts[k(pl.id)] || 0) * pointsPerSkin * 100) / 100;
    });
    return out;
}

function computePlayerTotals(round, p) {
    let gross = 0, strokePoints = 0, thru = 0;
    const hc = seHandicapForRound(round, p);   // course handicap, same as the admin app
    for (let h = 0; h < 18; h++) {
        const s = effectiveScore(round, p.id, h);
        if (s === '' || s == null) continue;
        const n = parseInt(s, 10);
        if (isNaN(n)) continue;
        thru++;
        gross += n;
        const par = (round.pars || [])[h];
        const holeHc = (round.handicaps || [])[h];
        const strokes = strokesOnHole(hc, holeHc);
        strokePoints += getPoints((n - strokes) - par);
    }

    // ── Bonus points, exactly as the admin app counts them ──
    // Stroke play alone never matched the main app's totals; BBB, balls remaining,
    // Extra 9 and CTP all contribute there too.
    // The admin app scores BBB from p.bbbTotal in every one of its calculation paths.
    // Counting per-hole bbbAwards here instead made the two apps disagree whenever the
    // per-hole entries and the aggregate had drifted. bbbTotal is the single source.
    const bbbCount = parseInt(p.bbbTotal, 10) || 0;
    const bbbPoints = bbbCount * BONUS.bbb;
    const ballPoints = (parseInt(p.ballsRemaining, 10) || 0) * BONUS.ball;

    // Extra9 / CTP winners are stored as "teamIdx-playerIdx" position strings
    let pos = null;
    (round.teams || []).forEach((t, ti) => (t.players || []).forEach((pl, pi) => {
        if (idsEqual(pl.id, p.id)) pos = ti + '-' + pi;
    }));
    const countWins = (arr) => {
        if (!Array.isArray(arr) || pos == null) return 0;
        return arr.filter(w => String(w) === pos || idsEqual(w, p.id)
            || (w && w.playerId != null && idsEqual(w.playerId, p.id))).length;
    };
    const extra9Points = countWins(round.extra9Winners) * BONUS.extra9;
    // CTP: count canonical entries for this player across all holes
    let ctpWins = 0;
    for (let h = 0; h < 18; h++) {
        if (idsEqual(effectiveCTP(round, h), p.id)) ctpWins++;
    }
    const ctpPoints = ctpWins * BONUS.ctp;

    // Skins: always net; points count toward the event total
    const _sk = computeSkinsMaps(round);
    const skinsPoints = _sk.points[String(p.id)] || 0;
    const skinsCount = _sk.counts[String(p.id)] || 0;

    const points = strokePoints + bbbPoints + ballPoints + extra9Points + ctpPoints + skinsPoints;
    return { gross, points, thru, strokePoints, bbbPoints, ballPoints, extra9Points, ctpPoints, skinsPoints, skinsCount, skinsPtsPer: _sk.pointsPerSkin };
}

// ═══════════════════════════════════════════════════════════════════════
// INPUT HANDLERS
// ═══════════════════════════════════════════════════════════════════════
function onScoreInput(e) {
    const input = e.target;
    const playerId = input.dataset.playerId;
    let val = input.value.trim();
    if (val !== '') {
        const n = parseInt(val, 10);
        if (isNaN(n) || n < 1 || n > 15) {
            // Invalid mid-typing — don't pendingEdit yet, but still don't lose what's there
            return;
        }
        val = String(n);
    }

    if (!state.pendingEdits.scores[playerId]) state.pendingEdits.scores[playerId] = {};
    state.pendingEdits.scores[playerId][state.currentHole] = val;

    updateCellLiveColor(playerId, val);
    updatePlayerTotalsLive();
    updateDotsLive();

    markUnsaved();

    // Auto-advance: 300ms after last keystroke, move focus to next score input on this hole
    if (state.autoAdvanceTimer) clearTimeout(state.autoAdvanceTimer);
    if (val !== '') {
        state.autoAdvanceTimer = setTimeout(() => {
            advanceFocusFrom(input);
        }, 300);
    }
}

function advanceFocusFrom(currentInput) {
    const inputs = Array.from(document.querySelectorAll('.score-input'));
    const idx = inputs.indexOf(currentInput);
    if (idx < 0) return;
    const next = inputs[idx + 1];
    if (!next) return; // last input on this hole — stop here
    // Some browsers preserve the keyboard if focus is moved synchronously.
    // setTimeout 0 to escape current event loop turn helps on iOS.
    next.focus();
    if (next.select) try { next.select(); } catch (_) {}
    // Scroll the next input into view if needed
    try { next.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {}
}

function onScoreBlur() {
    if (hasPendingEdits() && !state.saving) {
        if (state.pendingTimer) clearTimeout(state.pendingTimer);
        flushPendingEdits();
    }
}


function onBBBChange(e) {
    const slot = e.target.dataset.bbbSlot;
    if (!slot) return;
    const h = String(state.currentHole);
    if (!state.pendingEdits.bbb[h]) {
        // Seed from current effective values so we don't lose other slots
        state.pendingEdits.bbb[h] = { ...effectiveBBB(getRoundById(state.selectedRoundId), state.currentHole) };
    }
    state.pendingEdits.bbb[h][slot] = e.target.value || '';
    e.target.classList.toggle('has-value', !!e.target.value);
    markUnsaved();
}

function adjustBalls(playerId, delta) {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const current = effectiveBalls(round, playerId);
    const next = Math.max(0, Math.min(9, current + delta));
    if (next === current) return;
    state.pendingEdits.balls[idStr(playerId)] = next;

    const row = document.querySelector(`.balls-row[data-player-id="${cssEscape(idStr(playerId))}"]`);
    if (row) {
        row.querySelectorAll('.pip').forEach((p, i) => p.classList.toggle('full', i < next));
        const cnt = row.querySelector('[data-role="balls-count"]');
        if (cnt) cnt.textContent = String(next);
        const btns = row.querySelectorAll('.balls-btn');
        if (btns[0]) btns[0].disabled = (next <= 0);
        if (btns[1]) btns[1].disabled = (next >= 9);
    }

    markUnsaved();
}

function hasPendingEdits() {
    return Object.keys(state.pendingEdits.scores).length > 0
        || Object.keys(state.pendingEdits.ctpWinners).length > 0
        || Object.keys(state.pendingEdits.balls).length > 0
        || Object.keys(state.pendingEdits.bbb).length > 0;
}

// ═══════════════════════════════════════════════════════════════════════
// OFFLINE SUPPORT — the course often has dead signal. Three layers:
//  1. pendingEdits are persisted to localStorage on every tap → survive reloads.
//  2. The last rounds snapshot is cached → the app opens offline from cache.
//  3. A service worker (sw.js) caches the app shell + Firebase SDKs → the page
//     itself loads with no signal.
// ═══════════════════════════════════════════════════════════════════════
const LS_PENDING_KEY = 'dcPendingEdits';
const LS_ROUNDS_CACHE_KEY = 'dcRoundsCache';

function persistPendingEdits() {
    try {
        if (hasPendingEdits() && state.selectedRoundId != null) {
            localStorage.setItem(LS_PENDING_KEY, JSON.stringify({
                roundId: idStr(state.selectedRoundId),
                edits: state.pendingEdits,
                savedAt: Date.now()
            }));
        } else {
            localStorage.removeItem(LS_PENDING_KEY);
        }
    } catch (e) { /* storage blocked/full — the in-memory queue still works */ }
}

// Parked (not yet merged): adopted once the matching round is selected/rendered.
function restorePendingEdits() {
    try {
        const raw = localStorage.getItem(LS_PENDING_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);
        if (saved && saved.edits && typeof saved.edits === 'object') {
            state.__restoredPending = { roundId: idStr(saved.roundId), edits: saved.edits };
            if (hasPendingEditsLike(saved.edits)) setStatus('Unsaved ✎', 'saving');
        }
    } catch (e) { console.warn('Could not restore pending edits:', e); }
}

function hasPendingEditsLike(edits) {
    return !!(edits && (Object.keys(edits.scores || {}).length > 0
        || Object.keys(edits.ctpWinners || {}).length > 0
        || Object.keys(edits.balls || {}).length > 0
        || Object.keys(edits.bbb || {}).length > 0));
}

function mergePendingEdits(target, source) {
    if (!source) return;
    Object.keys(source.scores || {}).forEach(pid => {
        target.scores[pid] = Object.assign({}, target.scores[pid], source.scores[pid]);
    });
    Object.assign(target.ctpWinners, source.ctpWinners || {});
    Object.assign(target.balls, source.balls || {});
    Object.assign(target.bbb, source.bbb || {});
}

// Merge parked offline edits into the live queue once their round is on screen.
// Idempotent — safe to call from every render/flush path.
function adoptRestoredPendingEdits() {
    const rp = state.__restoredPending;
    if (!rp) return;
    if (state.selectedRoundId == null || !idsEqual(state.selectedRoundId, rp.roundId)) return;
    mergePendingEdits(state.pendingEdits, rp.edits);
    state.__restoredPending = null;
    if (hasPendingEdits()) { setStatus('Unsaved ✎', 'saving'); persistPendingEdits(); }
}

function cacheRoundsForOffline(arr) {
    try {
        localStorage.setItem(LS_ROUNDS_CACHE_KEY, JSON.stringify({ at: Date.now(), rounds: arr }));
    } catch (e) { /* cache is best-effort */ }
}

function loadCachedRounds() {
    try {
        const raw = localStorage.getItem(LS_ROUNDS_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed.rounds) ? parsed : null;
    } catch (e) { return null; }
}

// Firestore unreachable: fall back to the last cached snapshot instead of a
// dead-end error screen. The live listener keeps retrying on its own.
function handleListenError(err) {
    if (err && (err.code === 'unavailable' || err.code === 'failed-precondition')) {
        const cached = loadCachedRounds();
        if (cached && cached.rounds.length > 0) {
            console.warn('Firestore unreachable — opening from cached rounds.');
            updateOnlineStatus();
            handleRoundsSnapshot({ forEach: (fn) => cached.rounds.forEach((r) => fn({ data: () => ({ value: r }) })) });
            return;
        }
    }
    showFatalError('Connection error: ' + (err.message || err), 'Code: ' + (err.code || '?'));
}

function updateOnlineStatus() {
    const offline = !navigator.onLine;
    let pill = document.getElementById('offline-pill');
    if (!offline) { if (pill) pill.style.display = 'none'; return; }
    if (!pill) {
        pill = document.createElement('span');
        pill.id = 'offline-pill';
        pill.className = 'save-status';
        pill.style.cssText = 'display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #f59e0b;margin-right:6px;';
        const actions = document.querySelector('.header-actions');
        if (actions) actions.insertBefore(pill, actions.firstChild);
    }
    pill.textContent = '📴 Offline — scores stay on this device';
    pill.style.display = 'inline-block';
}
window.addEventListener('online', () => {
    updateOnlineStatus();
    if (hasPendingEdits()) flushPendingEdits();
});
window.addEventListener('offline', updateOnlineStatus);

// ═══════════════════════════════════════════════════════════════════════
// SAVE — Firestore transaction (last-save-wins)
// ═══════════════════════════════════════════════════════════════════════
// Taps no longer trigger a per-tap save. Edits collect locally and flush on hole
// change (plus app-background and player/round switch), which eliminates the
// tap-during-save race entirely on the course.
function markUnsaved() {
    setStatus('Unsaved \u270e', 'saving');
    persistPendingEdits();   // offline safety: the queue now survives reloads
}

// Remove from pendingEdits exactly the leaf values a successful flush wrote —
// but keep any key the user re-edited while the save was in flight.
function prunePendingEdits(saved) {
    Object.keys(saved.scores || {}).forEach(pid => {
        Object.keys(saved.scores[pid]).forEach(h => {
            if (state.pendingEdits.scores[pid] && state.pendingEdits.scores[pid][h] === saved.scores[pid][h]) {
                delete state.pendingEdits.scores[pid][h];
            }
        });
        if (state.pendingEdits.scores[pid] && Object.keys(state.pendingEdits.scores[pid]).length === 0) {
            delete state.pendingEdits.scores[pid];
        }
    });
    Object.keys(saved.ctpWinners || {}).forEach(h => {
        if (state.pendingEdits.ctpWinners[h] === saved.ctpWinners[h]) delete state.pendingEdits.ctpWinners[h];
    });
    Object.keys(saved.balls || {}).forEach(pid => {
        if (state.pendingEdits.balls[pid] === saved.balls[pid]) delete state.pendingEdits.balls[pid];
    });
    Object.keys(saved.bbb || {}).forEach(h => {
        if (state.pendingEdits.bbb[h] && JSON.stringify(state.pendingEdits.bbb[h]) === JSON.stringify(saved.bbb[h])) {
            delete state.pendingEdits.bbb[h];
        }
    });
}

async function flushPendingEdits() {
    adoptRestoredPendingEdits();
    if (state.saving) { state.pendingTimer = setTimeout(flushPendingEdits, 400); return; }
    if (!hasPendingEdits()) { setStatus('', ''); return; }

    // Snapshot WITHOUT clearing. Taps that land while this save is in flight stay in
    // state.pendingEdits (so effective* keeps showing them) and get their own flush.
    // On success we prune only the keys whose values match this snapshot.
    const edits = JSON.parse(JSON.stringify(state.pendingEdits));
    state.saving = true;
    state.pendingTimer = null;

    try {
        await firestoreDb.runTransaction(async (tx) => {
            const ref = roundDocRef(state.selectedRoundId);
            const snap = await tx.get(ref);
            if (!snap.exists) throw new Error('Round doc missing');
            const round = JSON.parse(JSON.stringify(snap.data().value || {}));
            if (!round || round.id == null) throw new Error('Round no longer exists');
            // Reject the write if the round has been finalized by the main app since these edits were started.
            // The transaction will throw here; the catch block below puts edits back so the user doesn't lose them
            // (though the round being locked means they're stuck unless reopened in the main app).
            if (round.completed === true) {
                const err = new Error('ROUND_COMPLETED');
                err.code = 'ROUND_COMPLETED';
                throw err;
            }

            // 0) Entering data IS starting the round. A scheduled round that has scores
            //    on it should read as In Progress everywhere — otherwise it sits in the
            //    "not started" list in both apps while people are out playing it.
            if (round.active === false) {
                round.active = true;
                round.startedAt = round.startedAt || Date.now();
            }

            // 1) Scores + balls (per-player edits within current group)
            (round.teams || []).forEach(team => {
                (team.players || []).forEach(player => {
                    if (player.groupNumber !== state.groupNumber) return;
                    const pid = idStr(player.id);

                    if (edits.scores[pid]) {
                        if (!Array.isArray(player.scores) || player.scores.length !== 18) {
                            player.scores = Array(18).fill('');
                        }
                        Object.keys(edits.scores[pid]).forEach(h => {
                            player.scores[parseInt(h, 10)] = edits.scores[pid][h];
                        });
                    }
                    if (edits.balls[pid] !== undefined) player.ballsRemaining = edits.balls[pid];
                });
            });

            // 2) CTP edits — write the SHARED format the admin app uses: an 18-slot array
            //    of "teamIdx-playerIdx" position strings indexed by hole. Audit metadata
            //    goes in ctpMeta/ctpLog so every scoring path in both apps keeps working.
            if (Object.keys(edits.ctpWinners).length > 0) {
                const posOf = (pid) => {
                    let pos = null;
                    (round.teams || []).forEach((t, ti) => (t.players || []).forEach((p, pi) => {
                        if (idsEqual(p.id, pid)) pos = ti + '-' + pi;
                    }));
                    return pos;
                };
                const nameOf = (pid) => {
                    let n = null;
                    (round.teams || []).forEach(t => (t.players || []).forEach(p => {
                        if (idsEqual(p.id, pid)) n = p.name;
                    }));
                    return n;
                };
                // Normalise whatever is there into 18 slots first
                const cw = Array.isArray(round.ctpWinners) ? round.ctpWinners : [];
                const slots = new Array(18).fill('');
                const par3s = (round.pars || []).map((p, i) => (parseInt(p) === 3 ? i : -1)).filter(i => i >= 0);
                if (cw.length === 18 && cw.every(v => typeof v !== 'object')) {
                    cw.forEach((v, i) => {
                        if (v === '' || v == null) return;
                        const s = String(v);
                        slots[i] = /^\d+-\d+$/.test(s) ? s : (posOf(s) || '');
                    });
                } else {
                    cw.forEach((item, idx) => {
                        if (item == null || item === '') return;
                        if (typeof item === 'object') {
                            const h = (item.holeIdx != null) ? item.holeIdx : (item.hole != null ? item.hole - 1 : null);
                            const pos = posOf(item.playerId);
                            if (h != null && h >= 0 && h < 18 && pos) slots[h] = pos;
                            return;
                        }
                        const s = String(item), h = par3s[idx];
                        if (h == null) return;
                        slots[h] = /^\d+-\d+$/.test(s) ? s : (posOf(s) || '');
                    });
                }

                if (!round.ctpMeta || typeof round.ctpMeta !== 'object') round.ctpMeta = {};
                if (!Array.isArray(round.ctpLog)) round.ctpLog = [];
                const setterName = nameOf(state.currentPlayerId) || 'Course';

                Object.keys(edits.ctpWinners).forEach(hStr => {
                    const holeIdx = parseInt(hStr, 10);
                    const winnerId = edits.ctpWinners[hStr];
                    const prevPos = slots[holeIdx];
                    const prevId = prevPos ? (() => {
                        const m = prevPos.match(/^(\d+)-(\d+)$/);
                        const pl = ((round.teams || [])[+m[1]] || {}).players || [];
                        return pl[+m[2]] ? pl[+m[2]].id : null;
                    })() : null;
                    const now = Date.now();
                    slots[holeIdx] = winnerId ? (posOf(winnerId) || '') : '';
                    if (winnerId) round.ctpMeta[holeIdx] = { setBy: setterName, setAt: now, source: 'course' };
                    else delete round.ctpMeta[holeIdx];
                    round.ctpLog.push({
                        holeIdx, at: now, by: setterName, source: 'course',
                        from: prevId ? (nameOf(prevId) || String(prevId)) : null,
                        to: winnerId ? (nameOf(winnerId) || String(winnerId)) : null
                    });
                });
                if (round.ctpLog.length > 200) round.ctpLog = round.ctpLog.slice(-200);
                round.ctpWinners = slots;
            }

            // 3) BBB edits (replace any entry for the hole)
            if (Object.keys(edits.bbb).length > 0) {
                if (!Array.isArray(round.bbbAwards)) round.bbbAwards = [];
                const myIds = currentGroupPlayerIds(round);
                Object.keys(edits.bbb).forEach(hStr => {
                    const holeIdx = parseInt(hStr, 10);
                    const slots = edits.bbb[hStr];
                    // Drop only THIS group's entry for the hole; other groups keep theirs.
                    round.bbbAwards = round.bbbAwards.filter(a => {
                        if (!a || a.holeIdx !== holeIdx) return true;
                        if (a.groupNumber != null) return a.groupNumber !== state.groupNumber;
                        return !bbbEntryIsForGroup(a, myIds);
                    });
                    if (slots.bingo || slots.bango || slots.bongo) {
                        round.bbbAwards.push({
                            holeIdx,
                            groupNumber: state.groupNumber,   // makes ownership explicit going forward
                            bingo: slots.bingo || '',
                            bango: slots.bango || '',
                            bongo: slots.bongo || ''
                        });
                    }
                });

                // Recompute every player's bbbTotal as count of awards across all holes
                const counts = {};
                round.bbbAwards.forEach(a => {
                    ['bingo', 'bango', 'bongo'].forEach(slot => {
                        const pid = a[slot];
                        if (pid) counts[idStr(pid)] = (counts[idStr(pid)] || 0) + 1;
                    });
                });
                (round.teams || []).forEach(team => {
                    (team.players || []).forEach(player => {
                        player.bbbTotal = counts[idStr(player.id)] || 0;
                    });
                });
            }

            tx.set(ref, {
                value: round,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });  // merge: preserve shardOrder + any doc-level metadata
        });

        state.saving = false;

        // Prune exactly what this flush saved; anything re-edited mid-flight survives.
        prunePendingEdits(edits);
        persistPendingEdits();

        if (hasPendingEdits()) {
            flushPendingEdits();
        } else {
            setStatus('Saved ✓', 'saved');
            setTimeout(() => {
                if (!state.saving && !hasPendingEdits()) setStatus('', '');
            }, 1500);
        }
    } catch (err) {
        console.error('Save error:', err);
        state.saving = false;
        // If the round was finalized by the main app, stop retrying and notify
        if (err && (err.code === 'ROUND_COMPLETED' || (err.message && err.message.includes('ROUND_COMPLETED')))) {
            setStatus('Round was finalized — edits not saved', 'error');
            // Drop pending edits (they'd never save anyway) and kick back to picker
            state.pendingEdits = { scores: {}, ctpWinners: {}, balls: {}, bbb: {} };
            persistPendingEdits();
            if (state.pendingTimer) { clearTimeout(state.pendingTimer); state.pendingTimer = null; }
            // Show a brief alert then bounce to the round picker so the now-locked round is gone from view
            setTimeout(() => {
                alert('This round is marked complete in the main app, so scores can\'t be saved right now.\n\n' +
                      'Your entries are being held safely — ask the organizer to reopen the round and they will save automatically.');
                state.selectedRoundId = null;
                state.currentPlayerId = null;
                state.groupNumber = null;
                state.currentHole = 0;
                render();
            }, 100);
            return;
        }
        if (!navigator.onLine) {
            // Offline: edits are persisted on-device; the 'online' listener flushes.
            setStatus('📴 Offline — will save when reconnected', 'error');
            return;
        }
        setStatus('Save failed — retrying', 'error');
        // pendingEdits was never cleared, so everything is still queued — just retry.
        state.pendingTimer = setTimeout(flushPendingEdits, 2500);
    }
}

// ═══════════════════════════════════════════════════════════════════════
// LIVE DOM updates (don't disturb focused input)
// ═══════════════════════════════════════════════════════════════════════
function cssEscape(s) {
    if (window.CSS && window.CSS.escape) return window.CSS.escape(String(s));
    return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\' + c);
}

function updateCellLiveColor(playerId, gross) {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const groupPlayers = getGroupPlayers(round, state.groupNumber);
    const p = groupPlayers.find(x => idsEqual(x.id, playerId));
    if (!p) return;

    const par = (round.pars || [])[state.currentHole];
    const holeHc = (round.handicaps || [])[state.currentHole];
    const hc = seHandicapForRound(round, p);
    const strokes = strokesOnHole(hc, holeHc);
    const cls = classForScore(gross, par, strokes);

    const wrap = document.querySelector(`.score-input-wrap[data-player-id="${cssEscape(idStr(playerId))}"]`);
    if (!wrap) return;
    ['albatross','eagle','birdie','par-score','bogey','double','worse'].forEach(c => wrap.classList.remove(c));
    if (cls) wrap.classList.add(cls);

    let badge = wrap.querySelector('.score-pts');
    if (gross !== '' && !isNaN(parseInt(gross, 10))) {
        const n = parseInt(gross, 10);
        const pts = getPoints((n - strokes) - par);
        if (!badge) {
            badge = document.createElement('span');
            badge.className = 'score-pts';
            wrap.appendChild(badge);
        }
        badge.textContent = `${pts}p`;
    } else if (badge) {
        badge.remove();
    }
}

function updatePlayerTotalsLive() {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const groupPlayers = getGroupPlayers(round, state.groupNumber);
    const rows = document.querySelectorAll('.score-row');
    rows.forEach((row, i) => {
        const p = groupPlayers[i];
        if (!p) return;
        const totals = computePlayerTotals(round, p);
        const meta = row.querySelector('.player-meta .total');
        if (meta) meta.textContent = `Thru ${totals.thru}: ${totals.gross || '—'} (${totals.points} pts)`;
    });
}

function updateDotsLive() {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const groupPlayers = getGroupPlayers(round, state.groupNumber);
    document.querySelectorAll('#dots-strip .dot').forEach((dot, h) => {
        const status = holeStatus(round, groupPlayers, h);
        dot.classList.remove('complete', 'partial');
        if (status) dot.classList.add(status);
    });
}

function refreshScoreEntryFromServer() {
    const round = getRoundById(state.selectedRoundId);
    if (!round) return;
    const groupPlayers = getGroupPlayers(round, state.groupNumber);

    // Scores — rebuild the score list in place. The tap-based pad has no keyboard focus
    // to preserve, and effectiveScore overlays any pending local edits, so this is safe.
    const oldList = document.getElementById('score-list');
    if (oldList) oldList.replaceWith(buildScoresList(round, groupPlayers));

    // (BBB buttons + the par-3 CTP chip live on the score rows, rebuilt above.)

    // Balls (only present on hole 18)
    if (state.currentHole === 17) {
        groupPlayers.forEach(p => {
            const pid = idStr(p.id);
            if (state.pendingEdits.balls[pid] !== undefined) return;
            const balls = effectiveBalls(round, p.id);
            const row = document.querySelector(`.balls-row[data-player-id="${cssEscape(pid)}"]`);
            if (!row) return;
            row.querySelectorAll('.pip').forEach((pip, i) => pip.classList.toggle('full', i < balls));
            const cnt = row.querySelector('[data-role="balls-count"]');
            if (cnt) cnt.textContent = String(balls);
            const btns = row.querySelectorAll('.balls-btn');
            if (btns[0]) btns[0].disabled = (balls <= 0);
            if (btns[1]) btns[1].disabled = (balls >= 9);
        });
    }

    updatePlayerTotalsLive();
    updateDotsLive();
}

// ─── Photo upload & remove (transactional Firestore updates) ────────────
let _photoUploadingCount = 0;

async function uploadRoundPhotos(fileList) {
    if (!firebaseStorage) {
        setStatus('Photos disabled (Storage not configured)', 'error');
        return;
    }
    if (!fileList || fileList.length === 0) return;
    const roundId = state.selectedRoundId;
    if (!roundId) return;
    
    const files = Array.from(fileList);
    _photoUploadingCount += files.length;
    setStatus(`📸 Uploading ${files.length} photo${files.length === 1 ? '' : 's'}…`, 'saving');
    
    let succeeded = 0;
    let lastErr = null;
    for (let i = 0; i < files.length; i++) {
        const file = files[i];
        try {
            // Compress, then upload to Firebase Storage
            const blob = await compressImage(file, 1000, 0.72); // ~half the bytes of 1200/0.85
            const ts = Date.now() + i; // unique even for rapid uploads
            const path = roundPhotoPath(roundId, ts);
            const url = await uploadPhotoBlob(blob, path);
            const entry = { url, path, uploadedAt: ts };
            
            // Transactionally merge this photo into round.photos[]
            await firestoreDb.runTransaction(async (tx) => {
                const ref = roundDocRef(roundId);
                const snap = await tx.get(ref);
                if (!snap.exists) throw new Error('Round doc missing');
                const round = JSON.parse(JSON.stringify(snap.data().value || {}));
                if (!round || round.id == null) throw new Error('Round no longer exists');
                if (!Array.isArray(round.photos)) round.photos = [];
                round.photos.push(entry);
                tx.set(ref, {
                    value: round,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });  // merge: preserve shardOrder + any doc-level metadata
            });
            succeeded++;
        } catch (err) {
            console.error(`Photo ${i + 1} upload failed:`, err);
            lastErr = err;
        } finally {
            _photoUploadingCount--;
        }
    }
    
    if (succeeded === 0) {
        // Surface the REAL reason so failures are diagnosable on the course.
        const code = lastErr && (lastErr.code || lastErr.name) || '';
        if (code === 'storage/unauthorized' || code === 'storage/unauthenticated') {
            setStatus('Upload blocked — Storage rules expired (check Firebase console)', 'error');
        } else if (code === 'storage/quota-exceeded') {
            setStatus('Storage quota exceeded — see Firebase console → Storage → Usage', 'error');
        } else if (code === 'storage/retry-limit-exceeded' || code === 'storage/canceled') {
            setStatus('Upload failed — poor connection, try again', 'error');
        } else {
            setStatus('Photo upload failed' + (code ? ` (${code})` : (lastErr && lastErr.message ? ` (${String(lastErr.message).slice(0, 60)})` : '')), 'error');
        }
    } else if (succeeded < files.length) {
        setStatus(`⚠️ ${succeeded} of ${files.length} uploaded`, 'saved');
        setTimeout(() => setStatus('Saved ✓', 'saved'), 2000);
    } else {
        setStatus(`✅ ${succeeded} photo${succeeded === 1 ? '' : 's'} added`, 'saved');
        setTimeout(() => setStatus('Saved ✓', 'saved'), 1500);
    }
    // The snapshot listener will pick up the new photos and re-render
}

async function removeRoundPhoto(index) {
    const roundId = state.selectedRoundId;
    if (!roundId) return;
    const round = getRoundById(roundId);
    if (!round || !Array.isArray(round.photos) || !round.photos[index]) return;
    
    if (!confirm('Remove this photo?')) return;
    
    const photo = round.photos[index];
    const photoPath = (photo && typeof photo === 'object' && photo.path) ? photo.path : null;
    
    setStatus('Removing photo…', 'saving');
    try {
        // 1) Remove from Firestore via transaction
        await firestoreDb.runTransaction(async (tx) => {
            const ref = roundDocRef(roundId);
            const snap = await tx.get(ref);
            if (!snap.exists) throw new Error('Round doc missing');
            const round = JSON.parse(JSON.stringify(snap.data().value || {}));
            if (!round || round.id == null) throw new Error('Round no longer exists');
            if (!Array.isArray(round.photos)) return;
            round.photos.splice(index, 1);
            tx.set(ref, {
                value: round,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });  // merge: preserve shardOrder + any doc-level metadata
        });
        // 2) Best-effort: delete the file from Storage
        if (photoPath) await deletePhotoAtPath(photoPath);
        setStatus('Photo removed', 'saved');
        setTimeout(() => setStatus('Saved ✓', 'saved'), 1500);
    } catch (err) {
        console.error('Remove photo failed:', err);
        setStatus('Failed to remove photo', 'error');
    }
}

async function togglePhotoTag(index, playerId) {
    const roundId = state.selectedRoundId;
    if (!roundId) return;
    setStatus('Saving tag…', 'saving');
    try {
        await firestoreDb.runTransaction(async (tx) => {
            const ref = roundDocRef(roundId);
            const snap = await tx.get(ref);
            if (!snap.exists) throw new Error('Round doc missing');
            const round = JSON.parse(JSON.stringify(snap.data().value || {}));
            if (!round || round.id == null || !Array.isArray(round.photos) || !round.photos[index]) return;
            let photo = round.photos[index];
            // Legacy string photo → object so it can carry tags
            if (typeof photo === 'string') photo = { url: photo };
            if (!Array.isArray(photo.playerIds)) photo.playerIds = [];
            const pos = photo.playerIds.findIndex(id => idsEqual(id, playerId));
            if (pos >= 0) photo.playerIds.splice(pos, 1);
            else photo.playerIds.push(playerId);
            round.photos[index] = photo;
            tx.set(ref, {
                value: round,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });  // merge: preserve shardOrder + any doc-level metadata
        });
        setStatus('Tag saved ✓', 'saved');
    } catch (err) {
        console.error('Tag toggle failed:', err);
        setStatus('Failed to save tag', 'error');
    }
}

function onPhotoFileSelected(ev) {
    const input = ev.target;
    if (input.files && input.files.length > 0) {
        uploadRoundPhotos(input.files);
    }
    input.value = ''; // reset so same file can be picked again
}

function togglePhotoCard() {
    const body = document.getElementById('photo-card-body');
    const caret = document.getElementById('photo-card-caret');
    if (!body) return;
    const isOpen = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    if (caret) caret.textContent = isOpen ? '▶' : '▼';
}

window.addEventListener('beforeunload', (e) => {
    if (hasPendingEdits() && !state.saving) {
        flushPendingEdits();
        e.preventDefault();
        e.returnValue = '';
    }
});

window.__dutchCup = { state, flushPendingEdits, getRoundById };

// Service worker: cache the app shell + Firebase SDKs so the page loads even
// with no signal on the course. (sw.js sits next to this file in the repo.)
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
        .catch(err => console.warn('Service worker registration failed:', err));
}

init();
</script>
</body>
</html>
